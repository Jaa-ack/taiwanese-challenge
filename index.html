<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="生活台語挑戰：適合國中小學生的閩南語文情境式互動練習網頁。"
    />
    <title>生活台語挑戰</title>
    <style>
:root {
  color-scheme: light;
  --ink: #172026;
  --muted: #66727d;
  --line: #d8e0e5;
  --paper: #fffdf8;
  --surface: #ffffff;
  --teal: #0f766e;
  --teal-dark: #0b514e;
  --gold: #f4b63f;
  --coral: #e5533d;
  --green: #1f8a54;
  --blue: #2b67d1;
  --shadow: 0 18px 50px rgba(31, 44, 56, 0.12);
}

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  min-height: 100vh;
  font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang TC", "Microsoft JhengHei", sans-serif;
  color: var(--ink);
  background:
    linear-gradient(90deg, rgba(15, 118, 110, 0.08) 1px, transparent 1px),
    linear-gradient(rgba(229, 83, 61, 0.06) 1px, transparent 1px),
    #f6f2e9;
  background-size: 28px 28px;
}

button {
  font: inherit;
}

.app-shell {
  width: min(1440px, 100%);
  min-height: 100vh;
  margin: 0 auto;
  display: grid;
  grid-template-columns: minmax(0, 1fr) 340px;
  gap: 20px;
  padding: 20px;
}

.game-panel,
.mini-panel {
  background: rgba(255, 255, 255, 0.92);
  border: 1px solid rgba(23, 32, 38, 0.08);
  box-shadow: var(--shadow);
}

.game-panel {
  border-radius: 8px;
  padding: 22px;
  display: flex;
  flex-direction: column;
  gap: 18px;
}

.topbar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 16px;
}

.eyebrow {
  margin: 0 0 4px;
  color: var(--teal-dark);
  font-weight: 700;
  font-size: 0.9rem;
}

h1,
h2,
h3,
p {
  margin-top: 0;
}

h1 {
  margin-bottom: 0;
  font-size: clamp(2rem, 4vw, 4.2rem);
  line-height: 1;
  font-weight: 900;
}

.score-card {
  min-width: 108px;
  min-height: 78px;
  border: 2px solid var(--ink);
  border-radius: 8px;
  display: grid;
  place-items: center;
  background: var(--gold);
  box-shadow: 6px 6px 0 var(--ink);
}

.score-card span {
  font-size: 0.82rem;
  font-weight: 700;
}

.score-card strong {
  font-size: 2rem;
  line-height: 1;
}

.scenario-tabs {
  display: grid;
  grid-template-columns: repeat(4, minmax(0, 1fr));
  gap: 10px;
}

.tab,
.mode-button,
.primary-button,
.ghost-button,
.icon-button {
  border: 1px solid var(--line);
  border-radius: 8px;
  background: var(--surface);
  color: var(--ink);
  cursor: pointer;
  transition: transform 160ms ease, border-color 160ms ease, background 160ms ease;
}

.tab {
  min-height: 58px;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  font-weight: 800;
}

.tab:hover,
.mode-button:hover,
.ghost-button:hover,
.icon-button:hover,
.answer-button:hover {
  transform: translateY(-1px);
}

.tab.is-active {
  background: var(--teal);
  color: #fff;
  border-color: var(--teal);
}

.tab-icon {
  width: 30px;
  height: 30px;
  border-radius: 50%;
  display: grid;
  place-items: center;
  background: rgba(255, 255, 255, 0.24);
  border: 1px solid currentColor;
  font-size: 0.85rem;
}

.content-grid {
  flex: 1;
  display: grid;
  grid-template-columns: minmax(280px, 0.92fr) minmax(360px, 1.08fr);
  gap: 18px;
}

.scene-stage,
.challenge-card {
  border-radius: 8px;
  border: 1px solid var(--line);
  background: var(--paper);
  min-height: 560px;
}

.scene-stage {
  overflow: hidden;
  display: grid;
  grid-template-rows: minmax(300px, 1fr) auto;
}

.scene-visual {
  position: relative;
  min-height: 320px;
  overflow: hidden;
  background: #f6f2e9;
}

.scene-art {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  display: none;
  object-fit: cover;
}

.scene-stage[data-scene="nightMarket"] .scene-art-night,
.scene-stage[data-scene="market"] .scene-art-market,
.scene-stage[data-scene="school"] .scene-art-school,
.scene-stage[data-scene="transport"] .scene-art-transport {
  display: block;
}

.summary-list {
  display: grid;
  grid-template-columns: repeat(3, minmax(0, 1fr));
  gap: 10px;
}

.summary-item {
  padding: 14px;
  border-radius: 8px;
  background: #fff;
  border: 1px solid var(--line);
}

.summary-item strong {
  display: block;
  font-size: 1.6rem;
  line-height: 1;
  margin-bottom: 6px;
}

.summary-item span {
  color: var(--muted);
  font-weight: 800;
}

.scene-copy {
  padding: 24px;
}

.scene-label {
  width: fit-content;
  margin-bottom: 10px;
  padding: 6px 10px;
  border-radius: 999px;
  background: #e7f5f2;
  color: var(--teal-dark);
  font-weight: 800;
  font-size: 0.88rem;
}

.scene-copy h2 {
  margin-bottom: 8px;
  font-size: clamp(1.55rem, 2.4vw, 2.6rem);
  line-height: 1.12;
}

.scene-copy p:last-child {
  margin-bottom: 0;
  color: var(--muted);
  font-size: 1.04rem;
}

.challenge-card {
  padding: 22px;
  display: flex;
  flex-direction: column;
  gap: 16px;
}

.progress-row {
  display: grid;
  grid-template-columns: auto 1fr;
  align-items: center;
  gap: 12px;
  color: var(--muted);
  font-weight: 800;
}

.progress-track {
  height: 10px;
  border-radius: 999px;
  background: #e5edf0;
  overflow: hidden;
}

.progress-track span {
  display: block;
  width: 0%;
  height: 100%;
  border-radius: inherit;
  background: var(--green);
  transition: width 220ms ease;
}

.speaker-box {
  display: flex;
  gap: 14px;
  align-items: flex-start;
  padding: 18px;
  border-radius: 8px;
  background: #172026;
  color: #fff;
}

.avatar {
  flex: 0 0 auto;
  width: 48px;
  height: 48px;
  border-radius: 50%;
  display: grid;
  place-items: center;
  background: var(--gold);
  color: var(--ink);
  font-weight: 900;
}

.speaker-name {
  margin-bottom: 4px;
  color: #a9f0e4;
  font-weight: 800;
}

.speaker-box h3 {
  margin-bottom: 8px;
  font-size: clamp(1.35rem, 2.2vw, 2.15rem);
  line-height: 1.2;
}

.translation {
  margin-bottom: 0;
  color: rgba(255, 255, 255, 0.72);
}

.answer-list {
  display: grid;
  gap: 10px;
}

.answer-button {
  width: 100%;
  min-height: 68px;
  padding: 12px 14px;
  border: 2px solid var(--line);
  border-radius: 8px;
  background: #fff;
  text-align: left;
  cursor: pointer;
  transition: transform 160ms ease, border-color 160ms ease, background 160ms ease;
}

.answer-button strong {
  display: block;
  font-size: 1.12rem;
  line-height: 1.28;
}

.answer-button span {
  display: block;
  margin-top: 4px;
  color: var(--muted);
  font-size: 0.92rem;
  line-height: 1.65;
}

.answer-button.is-correct {
  border-color: var(--green);
  background: #ecf8ef;
}

.answer-button.is-wrong {
  border-color: var(--coral);
  background: #fff0ec;
}

.answer-button:disabled {
  cursor: default;
}

.feedback {
  min-height: 104px;
  padding: 14px 16px;
  border-radius: 8px;
  border: 1px dashed #b7c4ca;
  background: #f8fbfb;
}

.feedback strong {
  display: block;
  margin-bottom: 6px;
  line-height: 1.55;
}

.feedback p {
  margin-bottom: 0;
  color: var(--muted);
  line-height: 1.65;
}

.feedback.success {
  border-color: var(--green);
  background: #eff9f1;
}

.feedback.error {
  border-color: var(--coral);
  background: #fff2ef;
}

.actions {
  margin-top: auto;
  display: grid;
  grid-template-columns: 1fr 1.2fr;
  gap: 10px;
}

.ghost-button,
.primary-button {
  min-height: 50px;
  font-weight: 900;
}

.ghost-button {
  background: #fff;
}

.primary-button {
  border-color: var(--teal);
  background: var(--teal);
  color: #fff;
}

.primary-button:disabled {
  opacity: 0.45;
  cursor: not-allowed;
  transform: none;
}

.ghost-button:disabled {
  opacity: 0.45;
  cursor: not-allowed;
  transform: none;
}

.learning-panel {
  display: flex;
  flex-direction: column;
  gap: 16px;
}

.mini-panel {
  border-radius: 8px;
  padding: 18px;
}

.panel-heading {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
  margin-bottom: 12px;
}

.mini-panel h2 {
  margin-bottom: 0;
  font-size: 1.15rem;
}

.panel-heading span {
  padding: 5px 9px;
  border-radius: 999px;
  background: #eef3f5;
  color: var(--teal-dark);
  font-weight: 900;
  font-size: 0.84rem;
}

.level-toggle {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 4px;
  padding: 4px;
  border-radius: 999px;
  background: #eef3f5;
}

.level-button {
  min-height: 32px;
  padding: 0 10px;
  border: 0;
  border-radius: 999px;
  background: transparent;
  color: var(--muted);
  font-size: 0.84rem;
  font-weight: 900;
  cursor: pointer;
}

.level-button.is-selected {
  background: var(--ink);
  color: #fff;
}

.level-button:hover {
  transform: translateY(-1px);
}

.mission-list {
  list-style: none;
  padding: 0;
  margin: 0;
  display: grid;
  gap: 10px;
}

.mission-list li {
  display: grid;
  grid-template-columns: 48px 1fr;
  align-items: center;
  gap: 12px;
  padding: 10px;
  border-radius: 8px;
  background: #f3f7f8;
}

.mission-list span {
  height: 44px;
  border-radius: 8px;
  display: grid;
  place-items: center;
  background: var(--ink);
  color: #fff;
  font-weight: 900;
  font-size: 1.25rem;
}

.mission-list p {
  margin-bottom: 0;
  font-weight: 800;
}

.phrase-card {
  padding: 14px;
  border-radius: 8px;
  background: #fff8e7;
  border: 1px solid #efd99c;
}

.taiwanese {
  margin-bottom: 8px;
  font-size: 1.3rem;
  line-height: 1.35;
  font-weight: 900;
}

.romanization {
  margin-bottom: 8px;
  color: var(--blue);
  font-weight: 700;
  line-height: 1.75;
}

.roman-text,
.romanization {
  font-family: "Charis SIL", "Gentium Plus", "Noto Sans", "DejaVu Sans", "Lucida Grande", "Segoe UI", Arial, sans-serif;
  font-variant-ligatures: none;
  letter-spacing: 0;
  unicode-bidi: isolate;
}

.meaning {
  margin-bottom: 0;
  color: var(--muted);
}

.icon-button {
  width: 38px;
  height: 38px;
  display: grid;
  place-items: center;
  font-size: 1.2rem;
  font-weight: 900;
}

.mode-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 8px;
  margin: 12px 0;
}

.mode-button {
  min-height: 44px;
  font-weight: 900;
}

.mode-button.is-selected {
  background: var(--ink);
  color: #fff;
  border-color: var(--ink);
}

#modeDescription {
  margin-bottom: 0;
  color: var(--muted);
  line-height: 1.6;
}

@media (max-width: 1080px) {
  .app-shell {
    grid-template-columns: 1fr;
  }

  .learning-panel {
    display: grid;
    grid-template-columns: repeat(3, minmax(0, 1fr));
  }
}

@media (max-width: 820px) {
  .app-shell {
    padding: 12px;
  }

  .game-panel {
    padding: 14px;
  }

  .topbar {
    align-items: flex-start;
  }

  .score-card {
    min-width: 88px;
    min-height: 68px;
    box-shadow: 4px 4px 0 var(--ink);
  }

  .scenario-tabs,
  .content-grid,
  .learning-panel {
    grid-template-columns: 1fr;
  }

  .tab {
    justify-content: flex-start;
    padding: 0 14px;
  }

  .scene-stage,
  .challenge-card {
    min-height: auto;
  }

  .scene-visual {
    min-height: 240px;
  }

  .progress-row,
  .actions,
  .summary-list {
    grid-template-columns: 1fr;
  }
}

@media (max-width: 480px) {
  .topbar {
    display: grid;
  }

  .score-card {
    justify-self: start;
  }

  .speaker-box {
    padding: 14px;
  }

  .avatar {
    width: 42px;
    height: 42px;
  }
}

    </style>
  </head>
  <body>
    <main class="app-shell">
      <section class="game-panel" aria-label="生活台語挑戰遊戲區">
        <header class="topbar">
          <div>
            <p class="eyebrow">閩南語文｜情境對話練習</p>
            <h1>生活台語挑戰</h1>
          </div>
          <div class="score-card" aria-live="polite">
            <span>得分</span>
            <strong id="score">0</strong>
          </div>
        </header>

        <nav class="scenario-tabs" aria-label="選擇生活情境">
          <button class="tab is-active" data-scenario="nightMarket" type="button">
            <span class="tab-icon">夜</span>
            夜市點餐
          </button>
          <button class="tab" data-scenario="market" type="button">
            <span class="tab-icon">市</span>
            市場購物
          </button>
          <button class="tab" data-scenario="school" type="button">
            <span class="tab-icon">校</span>
            校園問候
          </button>
          <button class="tab" data-scenario="transport" type="button">
            <span class="tab-icon">車</span>
            交通問路
          </button>
        </nav>

        <div class="content-grid">
          <section class="scene-stage" aria-labelledby="scene-title">
            <div class="scene-visual" id="sceneVisual" aria-hidden="true">
              <svg class="scene-art scene-art-night" viewBox="0 0 560 420" role="img">
                <rect width="560" height="420" fill="#24384b" />
                <rect y="230" width="560" height="190" fill="#d9824a" />
                <circle cx="96" cy="76" r="22" fill="#f8d66d" />
                <circle cx="464" cy="76" r="22" fill="#f8d66d" />
                <path d="M86 106h388l44 86H42z" fill="#e5533d" stroke="#172026" stroke-width="8" />
                <path d="M116 106h64l-24 86H84zM246 106h68l-12 86h-68zM380 106h64l32 86h-72z" fill="#fff4cf" />
                <rect x="78" y="190" width="404" height="152" rx="10" fill="#fff7df" stroke="#172026" stroke-width="8" />
                <rect x="104" y="226" width="132" height="80" rx="8" fill="#f4b63f" />
                <rect x="260" y="226" width="196" height="80" rx="8" fill="#0f766e" />
                <circle cx="148" cy="332" r="18" fill="#172026" />
                <circle cx="410" cy="332" r="18" fill="#172026" />
                <text x="280" y="279" text-anchor="middle" fill="#172026" font-size="42" font-weight="900">夜市</text>
              </svg>
              <svg class="scene-art scene-art-market" viewBox="0 0 560 420" role="img">
                <rect width="560" height="420" fill="#b9d9c4" />
                <rect y="250" width="560" height="170" fill="#6d9d63" />
                <path d="M70 154h420l34 78H36z" fill="#2b67d1" stroke="#172026" stroke-width="8" />
                <path d="M112 154h74l-22 78H86zM252 154h74l-8 78h-82zM392 154h74l34 78h-82z" fill="#fffdf8" />
                <rect x="80" y="230" width="400" height="118" rx="10" fill="#fff7df" stroke="#172026" stroke-width="8" />
                <circle cx="150" cy="282" r="28" fill="#e5533d" />
                <circle cx="205" cy="282" r="28" fill="#e5533d" />
                <ellipse cx="284" cy="282" rx="36" ry="24" fill="#1f8a54" />
                <ellipse cx="354" cy="282" rx="36" ry="24" fill="#1f8a54" />
                <path d="M405 302c34-54 64-54 88 0-30 15-60 15-88 0z" fill="#f4b63f" />
                <text x="280" y="122" text-anchor="middle" fill="#172026" font-size="40" font-weight="900">市場買菜</text>
              </svg>
              <svg class="scene-art scene-art-school" viewBox="0 0 560 420" role="img">
                <rect width="560" height="420" fill="#8ac6d6" />
                <rect y="282" width="560" height="138" fill="#90a64f" />
                <rect x="92" y="148" width="376" height="172" rx="8" fill="#fff7df" stroke="#172026" stroke-width="8" />
                <path d="M70 154l210-88 210 88z" fill="#f4b63f" stroke="#172026" stroke-width="8" />
                <rect x="240" y="238" width="80" height="82" fill="#0f766e" stroke="#172026" stroke-width="6" />
                <rect x="124" y="184" width="64" height="42" fill="#d9eef2" stroke="#172026" stroke-width="5" />
                <rect x="372" y="184" width="64" height="42" fill="#d9eef2" stroke="#172026" stroke-width="5" />
                <circle cx="158" cy="348" r="24" fill="#e5533d" stroke="#172026" stroke-width="5" />
                <circle cx="402" cy="348" r="24" fill="#2b67d1" stroke="#172026" stroke-width="5" />
                <rect x="138" y="368" width="40" height="34" rx="8" fill="#172026" />
                <rect x="382" y="368" width="40" height="34" rx="8" fill="#172026" />
                <text x="280" y="139" text-anchor="middle" fill="#172026" font-size="38" font-weight="900">校園</text>
              </svg>
              <svg class="scene-art scene-art-transport" viewBox="0 0 560 420" role="img">
                <rect width="560" height="420" fill="#a9c7e8" />
                <rect y="260" width="560" height="160" fill="#5c6670" />
                <path d="M0 342h560" stroke="#f4b63f" stroke-width="12" stroke-dasharray="44 32" />
                <rect x="86" y="162" width="292" height="112" rx="18" fill="#f4b63f" stroke="#172026" stroke-width="8" />
                <rect x="118" y="190" width="70" height="44" rx="6" fill="#e7f0f8" stroke="#172026" stroke-width="5" />
                <rect x="214" y="190" width="70" height="44" rx="6" fill="#e7f0f8" stroke="#172026" stroke-width="5" />
                <rect x="308" y="190" width="42" height="72" rx="6" fill="#fffdf8" stroke="#172026" stroke-width="5" />
                <circle cx="150" cy="280" r="24" fill="#172026" />
                <circle cx="318" cy="280" r="24" fill="#172026" />
                <rect x="420" y="116" width="18" height="188" fill="#172026" />
                <rect x="390" y="92" width="78" height="52" rx="8" fill="#e5533d" stroke="#172026" stroke-width="6" />
                <text x="429" y="128" text-anchor="middle" fill="#fffdf8" font-size="26" font-weight="900">站</text>
                <text x="280" y="78" text-anchor="middle" fill="#172026" font-size="38" font-weight="900">交通問路</text>
              </svg>
            </div>
            <div class="scene-copy">
              <p class="scene-label" id="sceneLabel">夜市點餐</p>
              <h2 id="scene-title">在熱鬧的夜市買晚餐</h2>
              <p id="scenePrompt">老闆問你想點什麼，請選出最自然的台語回答。</p>
            </div>
          </section>

          <section class="challenge-card" aria-labelledby="challenge-title">
            <div class="progress-row">
              <span id="roundText">第 1 / 3 題</span>
              <div class="progress-track" aria-hidden="true">
                <span id="progressBar"></span>
              </div>
            </div>

            <div class="speaker-box">
              <span class="avatar" id="speakerAvatar">闆</span>
              <div>
                <p class="speaker-name" id="speakerName">夜市老闆</p>
                <h3 id="challenge-title">「你欲食啥物？」</h3>
                <p class="translation" id="translation">你想吃什麼？</p>
              </div>
            </div>

            <div class="answer-list" id="answerList" aria-label="回答選項"></div>

            <div class="feedback" id="feedback" aria-live="polite">
              <strong>選一個回答開始挑戰。</strong>
              <p>答對後會看到台羅提示與生活使用說明。</p>
            </div>

            <div class="actions">
              <button class="ghost-button" id="hintButton" type="button">看提示</button>
              <button class="primary-button" id="nextButton" type="button" disabled>下一題</button>
            </div>
          </section>
        </div>
      </section>

      <aside class="learning-panel" aria-label="學習輔助區">
        <section class="mini-panel">
          <div class="panel-heading">
            <h2>今日任務</h2>

const phrases = [
  {
    taiwanese: "請問，這个外濟錢？",
    romanization: "Tshiánn-mn̄g, tsit ê guā tsē tsînn?",
    meaning: "請問，這個多少錢？"
  },
  {
    taiwanese: "我欲買一份，感謝。",
    romanization: "Guá beh bé tsi̍t hūn, kám-siā.",
    meaning: "我要買一份，謝謝。"
  },
  {
    taiwanese: "佇佗位？",
    romanization: "Tī tó-uī?",
    meaning: "在哪裡？"
  },
  {
    taiwanese: "我知影矣。",
    romanization: "Guá tsai-iánn--ah.",
    meaning: "我知道了。"
  },
  {
    taiwanese: "小可就好。",
    romanization: "Sió-khuá tō hó.",
    meaning: "一點點就好。"
  }
];

const state = {
  scenarioKey: "nightMarket",
  mode: "class",
  level: "beginner",
  questionIndex: 0,
  score: 0,
  answered: 0,
  correct: 0,
  roundAnswered: 0,
  roundCorrect: 0,
  streak: 0,
  selected: false,
  showingSummary: false,
  phraseIndex: 0
};

const elements = {
  score: document.querySelector("#score"),
  tabs: document.querySelectorAll(".tab"),
  sceneStage: document.querySelector(".scene-stage"),
  sceneLabel: document.querySelector("#sceneLabel"),
  sceneTitle: document.querySelector("#scene-title"),
  scenePrompt: document.querySelector("#scenePrompt"),
  roundText: document.querySelector("#roundText"),
  progressBar: document.querySelector("#progressBar"),
  speakerAvatar: document.querySelector("#speakerAvatar"),
  speakerName: document.querySelector("#speakerName"),
  challengeTitle: document.querySelector("#challenge-title"),
  translation: document.querySelector("#translation"),
  answerList: document.querySelector("#answerList"),
  feedback: document.querySelector("#feedback"),
  hintButton: document.querySelector("#hintButton"),
  nextButton: document.querySelector("#nextButton"),
  missionAnswered: document.querySelector("#missionAnswered"),
  missionCorrect: document.querySelector("#missionCorrect"),
  missionStreak: document.querySelector("#missionStreak"),
  levelButtons: document.querySelectorAll(".level-button"),
  phraseTaiwanese: document.querySelector("#phraseTaiwanese"),
  phraseRomanization: document.querySelector("#phraseRomanization"),
  phraseMeaning: document.querySelector("#phraseMeaning"),
  shufflePhrase: document.querySelector("#shufflePhrase"),
  modeButtons: document.querySelectorAll(".mode-button"),
  modeDescription: document.querySelector("#modeDescription")
};

function getCurrentScenario() {
  return scenarios[state.scenarioKey];
}

function getCurrentQuestions() {
  if (state.mode === "home") {
    return homeQuestionSets[state.scenarioKey];
  }

  return getCurrentScenario().questions;
}

function getCurrentQuestion() {
  return getCurrentQuestions()[state.questionIndex];
}

function isAdvancedLevel() {
  return state.level === "advanced";
}

function getScoreGain() {
  const base = isAdvancedLevel() ? 15 : 10;
  const streakBonus = isAdvancedLevel()
    ? Math.min(state.streak, 3) * 3
    : Math.min(state.streak, 3) * 2;

  return base + streakBonus;
}

function renderScenario() {
  const scenario = getCurrentScenario();
  const question = getCurrentQuestion();
  const questions = getCurrentQuestions();
  const progress = ((state.questionIndex + 1) / questions.length) * 100;

  elements.sceneStage.dataset.scene = scenario.scene;
  elements.sceneLabel.textContent = scenario.label;
  elements.sceneTitle.textContent = scenario.title;
  elements.scenePrompt.textContent = scenario.prompt;
  elements.speakerAvatar.textContent = scenario.avatar;
  elements.speakerName.textContent = scenario.speaker;
  elements.challengeTitle.textContent = `「${question.line}」`;
  elements.translation.hidden = isAdvancedLevel();
  elements.translation.textContent = isAdvancedLevel() ? "" : question.translation;
  elements.roundText.textContent = `${state.mode === "class" ? "課堂破冰" : "課後練習"}｜第 ${state.questionIndex + 1} / ${questions.length} 題`;
  elements.progressBar.style.width = `${progress}%`;
  elements.nextButton.disabled = true;
  elements.nextButton.textContent = "下一題";
  elements.hintButton.disabled = isAdvancedLevel();
  state.selected = false;
  state.showingSummary = false;

  elements.feedback.className = "feedback";
  elements.feedback.innerHTML = isAdvancedLevel()
    ? "<strong>選一个台語回答開始挑戰。</strong><p>進階模式答對加分較高。</p>"
    : "<strong>選一個回答開始挑戰。</strong><p>答對後會看到台羅提示與生活使用說明。</p>";
  renderAnswers(question);
}

function renderAnswers(question) {
  elements.answerList.innerHTML = "";

  question.answers.forEach((answer, index) => {
    const button = document.createElement("button");
    button.className = "answer-button";
    button.type = "button";
    button.innerHTML = isAdvancedLevel()
      ? `<strong>${answer.text}</strong>`
      : `<strong>${answer.text}</strong><span>${answer.meaning}</span>`;
    button.addEventListener("click", () => selectAnswer(index));
    elements.answerList.appendChild(button);
  });
}

function selectAnswer(index) {
  if (state.selected) return;

  const question = getCurrentQuestion();
  const answer = question.answers[index];
  const buttons = elements.answerList.querySelectorAll(".answer-button");

  state.selected = true;
  state.answered += 1;
  state.roundAnswered += 1;
  elements.nextButton.disabled = false;

  buttons.forEach((button, buttonIndex) => {
    const item = question.answers[buttonIndex];
    button.disabled = true;
    if (item.correct) button.classList.add("is-correct");
  });

  if (answer.correct) {
    state.score += getScoreGain();
    state.correct += 1;
    state.roundCorrect += 1;
    state.streak += 1;
    elements.feedback.className = "feedback success";
    elements.feedback.innerHTML = isAdvancedLevel()
      ? `<strong>答對了：${answer.text}</strong><p><span class="roman-text">${answer.romanization}</span></p>`
      : `<strong>答對了：<span class="roman-text">${answer.romanization}</span></strong><p>${answer.note}</p>`;
  } else {
    state.streak = 0;
    buttons[index].classList.add("is-wrong");
    const correct = question.answers.find((item) => item.correct);
    elements.feedback.className = "feedback error";
    elements.feedback.innerHTML = isAdvancedLevel()
      ? `<strong>正確回答：「${correct.text}」</strong><p><span class="roman-text">${correct.romanization}</span></p>`
      : `<strong>再想想：比較自然的回答是「${correct.text}」</strong><p><span class="roman-text">${correct.romanization}</span>｜${correct.meaning}</p>`;
  }

  if (state.questionIndex === getCurrentQuestions().length - 1) {
    elements.nextButton.textContent = "查看總結";
  }

  updateStats();
}

function updateStats() {
  elements.score.textContent = state.score;
  elements.missionAnswered.textContent = state.answered;
  elements.missionCorrect.textContent = state.correct;
  elements.missionStreak.textContent = state.streak;
}

function nextQuestion() {
  const questions = getCurrentQuestions();

  if (state.showingSummary) {
    state.questionIndex = 0;
    state.roundAnswered = 0;
    state.roundCorrect = 0;
    renderScenario();
    return;
  }

  if (state.questionIndex === questions.length - 1) {
    renderSummary();
    return;
  }

  state.questionIndex += 1;
  renderScenario();
}

function switchScenario(key) {
  state.scenarioKey = key;
  state.questionIndex = 0;
  state.roundAnswered = 0;
  state.roundCorrect = 0;
  state.showingSummary = false;
  elements.tabs.forEach((tab) => {
    tab.classList.toggle("is-active", tab.dataset.scenario === key);
  });
  renderScenario();
}

function renderSummary() {
  const scenario = getCurrentScenario();
  const total = getCurrentQuestions().length;
  const correct = state.roundCorrect;
  const accuracy = Math.round((correct / total) * 100);
  const message =
    correct === total
      ? "三題全對。你已經能抓到這個情境的對答邏輯，可以試著把句子換成自己的生活版本。"
      : correct >= 2
        ? "表現穩定。你已經掌握主要句型，建議再練一次答錯的那一題。"
        : "先把壓力放低。這次先記住正確句子的開頭，下一輪專心聽關鍵詞。";

  state.showingSummary = true;
  state.selected = true;
  elements.roundText.textContent = `${state.mode === "class" ? "課堂破冰" : "課後練習"}｜完成 ${total} 題`;
  elements.progressBar.style.width = "100%";
  elements.challengeTitle.textContent = `「${scenario.label}」挑戰完成`;
  elements.translation.hidden = false;
  elements.translation.textContent = isAdvancedLevel()
    ? `進階本輪 ${correct} / ${total}`
    : `本輪答對 ${correct} / ${total} 題`;
  elements.answerList.innerHTML = `
    <div class="summary-list">
      <div class="summary-item"><strong>${correct}</strong><span>答對題數</span></div>
      <div class="summary-item"><strong>${accuracy}%</strong><span>本輪正確率</span></div>
      <div class="summary-item"><strong>${state.score}</strong><span>累積得分</span></div>
    </div>
  `;
  elements.feedback.className = correct === total ? "feedback success" : "feedback";
  elements.feedback.innerHTML = `<strong>${message}</strong>`;
  elements.hintButton.disabled = true;
  elements.nextButton.disabled = false;
  elements.nextButton.textContent = "再挑戰一次";
}

function showHint() {
  const question = getCurrentQuestion();
  elements.feedback.className = "feedback";
  elements.feedback.innerHTML = isAdvancedLevel()
    ? "<strong>進階模式</strong><p>先從關鍵詞判斷情境，再選最自然的台語回應。</p>"
    : `<strong>提示</strong><p>${question.hint}</p>`;
}

function renderPhrase() {
  const phrase = phrases[state.phraseIndex];
  elements.phraseTaiwanese.textContent = phrase.taiwanese;
  elements.phraseRomanization.textContent = phrase.romanization;
  elements.phraseMeaning.textContent = isAdvancedLevel() ? "" : phrase.meaning;
  elements.phraseMeaning.hidden = isAdvancedLevel();
}

function shufflePhrase() {
  state.phraseIndex = (state.phraseIndex + 1) % phrases.length;
  renderPhrase();
}

function setLevel(level) {
  state.level = level;
  state.questionIndex = 0;
  state.roundAnswered = 0;
  state.roundCorrect = 0;
  state.showingSummary = false;

  elements.levelButtons.forEach((button) => {
    button.classList.toggle("is-selected", button.dataset.level === level);
  });

  renderScenario();
  renderPhrase();
}

function setMode(mode) {
  state.mode = mode;
  state.questionIndex = 0;
  state.roundAnswered = 0;
  state.roundCorrect = 0;
  state.showingSummary = false;

  elements.modeButtons.forEach((button) => {
    button.classList.toggle("is-selected", button.dataset.mode === mode);
  });

  elements.modeDescription.textContent =
    mode === "class"
      ? "課堂題較短，適合投影搶答、同儕口說與即時改編。"
      : "延伸情境會加入比較、借物、搭車確認等內容，適合學生自己重複練習。";
  renderScenario();
}

elements.tabs.forEach((tab) => {
  tab.addEventListener("click", () => switchScenario(tab.dataset.scenario));
});

elements.nextButton.addEventListener("click", nextQuestion);
elements.hintButton.addEventListener("click", showHint);
elements.shufflePhrase.addEventListener("click", shufflePhrase);
elements.levelButtons.forEach((button) => {
  button.addEventListener("click", () => setLevel(button.dataset.level));
});
elements.modeButtons.forEach((button) => {
  button.addEventListener("click", () => setMode(button.dataset.mode));
});

renderScenario();
renderPhrase();
updateStats();

    </script>
